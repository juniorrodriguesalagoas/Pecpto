<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cariri Sucré - Encomendas</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fbf5eb;
            color: #7b1220;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #b11f29;
            margin-bottom: 5px;
        }
        .subtitle {
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 1.1em;
            color: #7b1220;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .product {
            background-color: #b11f29;
            color: white;
            border-radius: 12px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .product:hover {
            transform: scale(1.02);
        }
        .product h3 {
            margin: 0 0 10px 0;
            font-size: 1.3em;
            text-transform: uppercase;
        }
        .product p {
            margin: 5px 0;
            font-weight: 600;
            font-size: 1.1em;
        }
        .product input {
            width: 90px;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            text-align: center;
            font-size: 1.1em;
            margin-top: 15px;
        }
        .total-section {
            font-size: 1.8em;
            font-weight: bold;
            margin: 30px 0;
            color: #b11f29;
            background: #fbf5eb;
            padding: 20px;
            border-radius: 10px;
        }
        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.3em;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-weight: bold;
            transition: background-color 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-whatsapp:hover {
            background-color: #128c7e;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Cariri Sucré - Encomendas</h1>
        <p class="subtitle">Arte em Açúcar. Pedidos de brigadeiros de 50 em 50 unidades.</p>

        <form id="orderForm">
            <div class="product-grid">
                <!-- Products generated by JS -->
            </div>

            <div class="total-section">
                Total do Pedido: R$ <span id="totalPrice">0,00</span>
            </div>

            <button type="button" class="btn-whatsapp" onclick="sendToWhatsApp()">Enviar Pedido para o WhatsApp</button>
        </form>
    </div>

    <script>
        const products = [
            { name: "Anêmona", price: 3.50 },
            { name: "Anêmona Dupla", price: 3.80 },
            { name: "Chanana", price: 3.50 },
            { name: "Flor de Babado", price: 3.50 },
            { name: "Flor de Lótus", price: 4.00 },
            { name: "Rosa", price: 4.00 },
            { name: "Girassol", price: 3.50 },
            { name: "Margarida", price: 3.50 },
            { name: "Flor de Cravo", price: 3.50 },
            { name: "Amarílis", price: 3.80 },
            { name: "Orquídea", price: 4.00 },
            { name: "Borboleta", price: 3.00 },
            { name: "Gérbera", price: 3.50 }
        ];

        const grid = document.querySelector('.product-grid');

        products.forEach((product, index) => {
            const div = document.createElement('div');
            div.className = 'product';
            div.innerHTML = `
                <h3>${product.name}</h3>
                <p>R$ ${product.price.toFixed(2).replace('.', ',')}/Unid</p>
                <input type="number" id="qty-${index}" min="0" step="50" value="0" onchange="calculateTotal()" placeholder="0">
            `;
            grid.appendChild(div);
        });

        function calculateTotal() {
            let total = 0;
            products.forEach((product, index) => {
                const qtyInput = document.getElementById(`qty-${index}`);
                let qty = parseInt(qtyInput.value);

                if (isNaN(qty) || qty < 0) {
                    qty = 0;
                }

                // Force to be multiple of 50
                if (qty > 0 && qty % 50 !== 0) {
                    qty = Math.round(qty / 50) * 50;
                    if (qty === 0) qty = 50;
                    qtyInput.value = qty;
                } else {
                    qtyInput.value = qty; // cleans up e.g. "00"
                }

                total += qty * product.price;
            });
            document.getElementById('totalPrice').innerText = total.toFixed(2).replace('.', ',');
        }

        function sendToWhatsApp() {
            calculateTotal();

            let text = "Olá! Gostaria de fazer o seguinte pedido:\\n\\n";
            let total = 0;
            let hasItems = false;

            products.forEach((product, index) => {
                let qty = parseInt(document.getElementById(`qty-${index}`).value) || 0;
                if (qty > 0) {
                    let subtotal = qty * product.price;
                    text += `- ${qty}x ${product.name} (R$ ${subtotal.toFixed(2).replace('.', ',')})\\n`;
                    total += subtotal;
                    hasItems = true;
                }
            });

            if (!hasItems) {
                alert("Por favor, selecione ao menos um item para fazer o pedido.");
                return;
            }

            text += `\\n*Total: R$ ${total.toFixed(2).replace('.', ',')}*`;

            const encodedText = encodeURIComponent(text);
            const phoneNumber = "5588999620935";
            const url = `https://wa.me/${phoneNumber}?text=${encodedText}`;

            window.open(url, '_blank');
        }
    </script>
</body>
</html>
